<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バスケットボール練習＆タイマー</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ea580c">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .active-tab { border-b-2 border-orange-500 text-orange-500 font-bold; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-extrabold text-orange-500 flex items-center gap-2">
      🏀 バスケ練習アシスト
    </h1>
    <span id="pwa-status" class="text-xs bg-emerald-900 text-emerald-300 px-2 py-1 rounded-full border border-emerald-700">準備完了</span>
  </header>

  <!-- タブナビゲーション -->
  <nav class="flex bg-slate-800 border-b border-slate-700 sticky top-[61px] z-10 text-sm text-slate-400">
    <button onclick="switchTab('timer')" id="tab-timer" class="flex-1 py-3 text-center active-tab">⏱️ タイマー</button>
    <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-3 text-center">⚙️ メニュー設定</button>
    <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-3 text-center">📅 練習記録</button>
    <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-3 text-center">📂 設定</button>
  </nav>

  <!-- メインコンテンツエリア -->
  <main class="p-4 max-w-lg mx-auto">

    <!-- 1. タイマー画面 -->
    <section id="sec-timer" class="block space-y-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
        <label class="block text-sm font-medium text-slate-400 mb-2">練習メニューを選択:</label>
        <select id="timer-menu-select" onchange="loadSelectedMenuToTimer()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-orange-400 font-bold focus:outline-none focus:border-orange-500">
        </select>
      </div>

      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl text-center space-y-4">
        <div class="flex justify-between items-center text-xs text-slate-400">
          <span id="current-step-type" class="bg-orange-500/20 text-orange-400 px-3 py-1 rounded-full border border-orange-500/30">運動</span>
          <span id="step-progress" class="font-mono">ステップ 1 / 1</span>
        </div>

        <h2 id="current-step-title" class="text-2xl font-bold text-white min-h-[2rem] flex items-center justify-center">
          メニューを選択してください
        </h2>

        <div class="py-4">
          <div id="timer-display" class="text-7xl font-extrabold font-mono text-orange-500 tracking-wider">
            00:00
          </div>
        </div>

        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="timer-progress-bar" class="bg-orange-500 h-full w-full transition-all duration-300"></div>
        </div>

        <div class="text-sm text-slate-400 min-h-[1.5rem]" id="next-step-preview">
          次: なし
        </div>

        <div class="grid grid-cols-3 gap-3 pt-4">
          <button id="btn-start" onclick="toggleTimer()" class="col-span-2 bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-extrabold py-4 rounded-xl shadow-lg text-lg transition-colors">
            START
          </button>
          <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-4 rounded-xl shadow">
            リセット
          </button>
        </div>

        <button onclick="nextStep()" class="w-full bg-slate-700/50 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs">
          スキップ (次のステップへ) ⏭️
        </button>

        <div id="finish-action" class="hidden pt-4 border-t border-slate-700">
          <p class="text-emerald-400 font-bold mb-2">🎉 全ステップが完了しました！</p>
          <button onclick="markCurrentMenuAsDone()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg">
            本日のカレンダーに記録する 📝
          </button>
        </div>
      </div>
    </section>

    <!-- 2. メニュー設定画面 -->
    <section id="sec-menu" class="hidden space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white">メニュー一覧・編集</h2>
        <button onclick="addNewMenuPrompt()" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow">
          ＋ 新規メニュー
        </button>
      </div>
      <div id="menu-list-container" class="space-y-4"></div>
    </section>

    <!-- 3. カレンダー記録画面 -->
    <section id="sec-calendar" class="hidden space-y-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
        <label class="block text-sm font-medium text-slate-400 mb-1">日付を選択:</label>
        <input type="date" id="calendar-date-picker" onchange="renderCalendarRecords()" class="bg-slate-900 border border-slate-700 text-white rounded-lg p-2 w-full focus:outline-none focus:border-orange-500">
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md space-y-3">
        <h3 class="text-md font-bold text-orange-400" id="selected-date-label">選択した日の記録</h3>
        <div id="calendar-checklist" class="space-y-2"></div>
      </div>
    </section>

    <!-- 4. 設定画面（データバックアップ/復元） -->
    <section id="sec-settings" class="hidden space-y-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md space-y-4">
        <h2 class="text-lg font-bold text-orange-400 flex items-center gap-2">
          📂 データバックアップ / 移行
        </h2>
        <p class="text-xs text-slate-400 leading-relaxed">
          PCで作成した練習メニューをファイルとして出力し、スマホ側で読み込むことで簡単にデータを同期できます。
        </p>

        <div class="space-y-3 pt-2">
          <button onclick="exportData()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl border border-slate-600 flex items-center justify-center gap-2 shadow">
            📥 バックアップファイルをダウンロード
          </button>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">復元するファイルを選択 (.json):</label>
            <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer border border-slate-700 rounded-lg bg-slate-900">
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const DEFAULT_MENUS = [
      {
        id: 'menu_1',
        title: 'ドリブル基礎①',
        steps: [
          { name: '右手パワーパウンド', duration: 30, type: 'work' },
          { name: '休憩', duration: 10, type: 'rest' },
          { name: '左手パワーパウンド', duration: 30, type: 'work' },
          { name: '休憩', duration: 10, type: 'rest' },
          { name: 'フロントチェンジ', duration: 30, type: 'work' }
        ]
      }
    ];

    let menus = JSON.parse(localStorage.getItem('basket_menus')) || DEFAULT_MENUS;
    let records = JSON.parse(localStorage.getItem('basket_records')) || {};

    let currentMenu = null;
    let currentStepIndex = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let isRunning = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function saveMenus() {
      localStorage.setItem('basket_menus', JSON.stringify(menus));
      initMenuSelect();
      renderMenuList();
    }
    function saveRecords() {
      localStorage.setItem('basket_records', JSON.stringify(records));
    }

    function switchTab(tabName) {
      ['timer', 'menu', 'calendar', 'settings'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active-tab');
      });
      document.getElementById(`sec-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).classList.add('active-tab');
    }

    function initMenuSelect() {
      const select = document.getElementById('timer-menu-select');
      select.innerHTML = '';
      menus.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.title;
        select.appendChild(opt);
      });
      if (menus.length > 0) loadSelectedMenuToTimer();
    }

    function loadSelectedMenuToTimer() {
      const selectedId = document.getElementById('timer-menu-select').value;
      currentMenu = menus.find(m => m.id === selectedId) || menus[0];
      resetTimer();
    }

    function updateTimerUI() {
      if (!currentMenu || !currentMenu.steps[currentStepIndex]) return;
      const step = currentMenu.steps[currentStepIndex];

      document.getElementById('current-step-title').textContent = step.name;
      document.getElementById('step-progress').textContent = `ステップ ${currentStepIndex + 1} / ${currentMenu.steps.length}`;

      const typeLabel = document.getElementById('current-step-type');
      if (step.type === 'rest') {
        typeLabel.textContent = '休憩';
        typeLabel.className = 'bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full border border-blue-500/30';
      } else {
        typeLabel.textContent = '運動';
        typeLabel.className = 'bg-orange-500/20 text-orange-400 px-3 py-1 rounded-full border border-orange-500/30';
      }

      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;

      const pct = (timerSeconds / step.duration) * 100;
      document.getElementById('timer-progress-bar').style.width = `${pct}%`;

      const nextStep = currentMenu.steps[currentStepIndex + 1];
      document.getElementById('next-step-preview').textContent = nextStep ? `次: ${nextStep.name} (${nextStep.duration}秒)` : '次: これで完了！';
    }

    function toggleTimer() {
      if (isRunning) pauseTimer();
      else startTimer();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('btn-start').textContent = 'PAUSE';
      document.getElementById('btn-start').className = 'col-span-2 bg-yellow-600 hover:bg-yellow-500 text-white font-extrabold py-4 rounded-xl shadow-lg text-lg';

      playBeep(880, 0.2);

      timerInterval = setInterval(() => {
        timerSeconds--;
        if (timerSeconds <= 3 && timerSeconds > 0) playBeep(440, 0.1);

        if (timerSeconds < 0) {
          nextStep();
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('btn-start').textContent = 'START';
      document.getElementById('btn-start').className = 'col-span-2 bg-orange-600 hover:bg-orange-500 text-white font-extrabold py-4 rounded-xl shadow-lg text-lg';
    }

    function resetTimer() {
      pauseTimer();
      currentStepIndex = 0;
      if (currentMenu && currentMenu.steps.length > 0) {
        timerSeconds = currentMenu.steps[0].duration;
      } else {
        timerSeconds = 0;
      }
      document.getElementById('finish-action').classList.add('hidden');
      updateTimerUI();
    }

    function nextStep() {
      clearInterval(timerInterval);
      currentStepIndex++;
      if (currentMenu && currentStepIndex < currentMenu.steps.length) {
        timerSeconds = currentMenu.steps[currentStepIndex].duration;
        updateTimerUI();
        if (isRunning) {
          playBeep(880, 0.2);
          timerInterval = setInterval(() => {
            timerSeconds--;
            if (timerSeconds <= 3 && timerSeconds > 0) playBeep(440, 0.1);
            if (timerSeconds < 0) nextStep();
            else updateTimerUI();
          }, 1000);
        }
      } else {
        pauseTimer();
        playBeep(1200, 0.5);
        document.getElementById('timer-display').textContent = 'COMPLETE';
        document.getElementById('finish-action').classList.remove('hidden');
      }
    }

    function renderMenuList() {
      const container = document.getElementById('menu-list-container');
      container.innerHTML = '';
      menus.forEach((m, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-700 pb-2">
            <input type="text" value="${m.title}" onchange="updateMenuTitle('${m.id}', this.value)" class="bg-slate-900 border border-slate-700 text-orange-400 font-bold text-md rounded px-2 py-1 focus:outline-none">
            <button onclick="deleteMenu('${m.id}')" class="text-xs bg-red-900/50 text-red-300 px-2 py-1 rounded">削除</button>
          </div>
          <div class="space-y-2">
            ${m.steps.map((s, sIdx) => `
              <div class="flex items-center gap-2 text-xs">
                <input type="text" value="${s.name}" onchange="updateStep('${m.id}',${sIdx}, 'name', this.value)" class="bg-slate-900 border border-slate-700 text-white rounded p-1 flex-1">
                <input type="number" value="${s.duration}" onchange="updateStep('${m.id}',${sIdx}, 'duration', parseInt(this.value))" class="bg-slate-900 border border-slate-700 text-white rounded p-1 w-14 text-center">秒
                <select onchange="updateStep('${m.id}',${sIdx}, 'type', this.value)" class="bg-slate-900 border border-slate-700 text-slate-300 rounded p-1">
                  <option value="work" ${s.type === 'work' ? 'selected' : ''}>運動</option>
                  <option value="rest" ${s.type === 'rest' ? 'selected' : ''}>休憩</option>
                </select>
                <button onclick="deleteStep('${m.id}',${sIdx})" class="text-red-400">✕</button>
              </div>
            `).join('')}
          </div>
          <button onclick="addStep('${m.id}')" class="w-full bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded border border-dashed border-slate-600">＋ ステップ追加</button>
        `;
        container.appendChild(card);
      });
    }

    function updateMenuTitle(id, val) {
      const m = menus.find(x => x.id === id);
      if (m) { m.title = val; saveMenus(); }
    }
    function deleteMenu(id) {
      menus = menus.filter(x => x.id !== id);
      saveMenus();
    }
    function addNewMenuPrompt() {
      const title = prompt('新しいメニュー名を入力してください:', 'シュート練習①');
      if (title) {
        menus.push({ id: 'menu_' + Date.now(), title: title, steps: [{ name: '練習1', duration: 30, type: 'work' }] });
        saveMenus();
      }
    }
    function updateStep(mId, sIdx, key, val) {
      const m = menus.find(x => x.id === mId);
      if (m && m.steps[sIdx]) { m.steps[sIdx][key] = val; saveMenus(); }
    }
    function deleteStep(mId, sIdx) {
      const m = menus.find(x => x.id === mId);
      if (m) { m.steps.splice(sIdx, 1); saveMenus(); }
    }
    function addStep(mId) {
      const m = menus.find(x => x.id === mId);
      if (m) { m.steps.push({ name: '新規ステップ', duration: 30, type: 'work' }); saveMenus(); }
    }

    const datePicker = document.getElementById('calendar-date-picker');
    datePicker.value = new Date().toISOString().split('T')[0];

    function renderCalendarRecords() {
      const date = datePicker.value;
      document.getElementById('selected-date-label').textContent = `${date} の練習記録`;
      const container = document.getElementById('calendar-checklist');
      container.innerHTML = '';

      const dayRecord = records[date] || [];

      menus.forEach(m => {
        const isChecked = dayRecord.includes(m.id);
        const item = document.createElement('label');
        item.className = 'flex items-center gap-3 bg-slate-900 p-3 rounded-lg border border-slate-700 cursor-pointer';
        item.innerHTML = `
          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRecord('${date}', '${m.id}')" class="w-5 h-5 accent-orange-500 rounded">
          <span class="text-sm font-medium ${isChecked ? 'text-orange-400 font-bold' : 'text-slate-300'}">${m.title}</span>
        `;
        container.appendChild(item);
      });
    }

    function toggleRecord(date, menuId) {
      if (!records[date]) records[date] = [];
      if (records[date].includes(menuId)) {
        records[date] = records[date].filter(id => id !== menuId);
      } else {
        records[date].push(menuId);
      }
      saveRecords();
      renderCalendarRecords();
    }

    function markCurrentMenuAsDone() {
      if (!currentMenu) return;
      const today = new Date().toISOString().split('T')[0];
      if (!records[today]) records[today] = [];
      if (!records[today].includes(currentMenu.id)) {
        records[today].push(currentMenu.id);
        saveRecords();
      }
      alert(`「${currentMenu.title}」を本日の記録に追加しました！`);
      switchTab('calendar');
      datePicker.value = today;
      renderCalendarRecords();
    }

    function exportData() {
      const data = { menus, records };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `basket_app_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.menus) menus = data.menus;
          if (data.records) records = data.records;
          saveMenus();
          saveRecords();
          renderCalendarRecords();
          alert('バックアップデータを正常に復元しました！');
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。');
        }
      };
      reader.readAsText(file);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    initMenuSelect();
    renderMenuList();
    renderCalendarRecords();
  </script>
</body>
</html>
