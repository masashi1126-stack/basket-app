<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バスケットボール練習アプリ</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .active-tab { border-b-2 border-blue-600 text-blue-600 font-bold; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-20">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-gray-200 p-4 sticky top-0 z-10 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-blue-600">🏀 バスケ練習ノート</h1>
    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">プロトタイプ</span>
  </header>

  <!-- タブナビゲーション -->
  <nav class="flex bg-white border-b border-gray-200 sticky top-[57px] z-10 text-sm text-gray-500">
    <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-3 text-center active-tab">📅 練習記録</button>
    <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-3 text-center">⚙️ メニュー設定</button>
    <button onclick="switchTab('timer')" id="tab-timer" class="flex-1 py-3 text-center">⏱️ タイマー</button>
    <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-3 text-center">📂 データ移行</button>
  </nav>

  <!-- メインコンテンツ -->
  <main class="p-4 max-w-lg mx-auto">

    <!-- 1. カレンダー・練習記録 -->
    <section id="sec-calendar" class="block space-y-4">
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <label class="block text-sm font-medium text-gray-700 mb-1">日付を選択:</label>
        <input type="date" id="calendar-date-picker" onchange="renderCalendar()" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2 w-full focus:outline-none focus:border-blue-500">
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-3">
        <h2 class="font-bold text-gray-800 border-b pb-2" id="selected-date-label">選択した日の記録</h2>
        <div id="calendar-checklist" class="space-y-2"></div>
      </div>
    </section>

    <!-- 2. メニュー設定 -->
    <section id="sec-menu" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-gray-800">練習メニュー一覧</h2>
        <button onclick="addNewMenu()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm">
          ＋ メニュー追加
        </button>
      </div>
      <div id="menu-list" class="space-y-3"></div>
    </section>

    <!-- 3. タイマー -->
    <section id="sec-timer" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-center space-y-4">
        <div class="text-sm font-medium text-blue-600" id="timer-status">準備完了</div>
        <div id="timer-display" class="text-6xl font-extrabold font-mono text-gray-800 tracking-wider">
          00:30
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs text-left bg-gray-50 p-3 rounded-lg border border-gray-200">
          <div>運動時間: <input type="number" id="cfg-work" value="30" class="w-12 border rounded text-center"> 秒</div>
          <div>休憩時間: <input type="number" id="cfg-rest" value="5" class="w-12 border rounded text-center"> 秒</div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button id="btn-timer-start" onclick="toggleTimer()" class="bg-blue-600 text-white font-bold py-3 rounded-lg shadow">
            スタート
          </button>
          <button onclick="resetTimer()" class="bg-gray-200 text-gray-700 font-bold py-3 rounded-lg">
            リセット
          </button>
        </div>
      </div>
    </section>

    <!-- 4. データ移行（追加機能） -->
    <section id="sec-settings" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 space-y-4">
        <h2 class="font-bold text-gray-800 border-b pb-2">📂 PCとスマホのデータ同期</h2>
        <p class="text-xs text-gray-600 leading-relaxed">
          PCで編集したメニューをファイルとして出力し、スマホで読み込むことでデータを共通化できます。
        </p>

        <div class="space-y-3 pt-2">
          <button onclick="exportData()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm text-sm">
            📥 PCのデータを書き出す（保存）
          </button>

          <div class="border-t pt-3">
            <label class="block text-xs font-medium text-gray-700 mb-1">スマホで読み込む (.jsonファイル):</label>
            <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="block w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 border rounded-lg bg-gray-50">
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const DEFAULT_MENUS = [
      { id: 'm1', title: 'ドリブル練習①', detail: '右手30秒 / 休憩5秒 / 左手30秒' },
      { id: 'm2', title: 'シュート練習①', detail: 'ゴール下10本 / ミドル10本' }
    ];

    let menus = JSON.parse(localStorage.getItem('bk_menus')) || DEFAULT_MENUS;
    let records = JSON.parse(localStorage.getItem('bk_records')) || {};

    function saveMenus() {
      localStorage.setItem('bk_menus', JSON.stringify(menus));
      renderMenuList();
      renderCalendar();
    }
    function saveRecords() {
      localStorage.setItem('bk_records', JSON.stringify(records));
    }

    function switchTab(tab) {
      ['calendar', 'menu', 'timer', 'settings'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active-tab');
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('active-tab');
    }

    // カレンダー機能
    const datePicker = document.getElementById('calendar-date-picker');
    datePicker.value = new Date().toISOString().split('T')[0];

    function renderCalendar() {
      const date = datePicker.value;
      document.getElementById('selected-date-label').textContent = `${date} の練習記録`;
      const container = document.getElementById('calendar-checklist');
      container.innerHTML = '';

      const dayRecord = records[date] || [];

      menus.forEach(m => {
        const checked = dayRecord.includes(m.id);
        const div = document.createElement('label');
        div.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 cursor-pointer';
        div.innerHTML = `
          <div>
            <div class="font-bold text-sm text-gray-800">${m.title}</div>
            <div class="text-xs text-gray-500">${m.detail}</div>
          </div>
          <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleRecord('${date}', '${m.id}')" class="w-5 h-5 accent-blue-600 rounded">
        `;
        container.appendChild(div);
      });
    }

    function toggleRecord(date, menuId) {
      if (!records[date]) records[date] = [];
      if (records[date].includes(menuId)) {
        records[date] = records[date].filter(id => id !== menuId);
      } else {
        records[date].push(menuId);
      }
      saveRecords();
    }

    // メニュー編集機能
    function renderMenuList() {
      const container = document.getElementById('menu-list');
      container.innerHTML = '';
      menus.forEach((m, idx) => {
        const div = document.createElement('div');
        div.className = 'bg-white p-3 rounded-lg border border-gray-200 shadow-sm space-y-2';
        div.innerHTML = `
          <input type="text" value="${m.title}" onchange="updateMenu(${idx}, 'title', this.value)" class="font-bold w-full border-b pb-1 text-sm focus:outline-none border-gray-300">
          <input type="text" value="${m.detail}" onchange="updateMenu(${idx}, 'detail', this.value)" class="text-xs text-gray-600 w-full border-b pb-1 focus:outline-none border-gray-300">
          <div class="text-right">
            <button onclick="deleteMenu(${idx})" class="text-xs text-red-500 hover:underline">削除</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateMenu(idx, key, val) {
      menus[idx][key] = val;
      saveMenus();
    }

    function deleteMenu(idx) {
      menus.splice(idx, 1);
      saveMenus();
    }

    function addNewMenu() {
      menus.push({ id: 'm_' + Date.now(), title: '新しいメニュー', detail: '内容を入力してください' });
      saveMenus();
    }

    // タイマー機能
    let timerVal = 30;
    let timerInt = null;
    let isWork = true;
    let isRunning = false;

    function updateTimerUI() {
      const s = String(timerVal).padStart(2, '0');
      document.getElementById('timer-display').textContent = `00:${s}`;
      document.getElementById('timer-status').textContent = isWork ? '運動時間！💪' : '休憩時間 ☕';
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInt);
        isRunning = false;
        document.getElementById('btn-timer-start').textContent = 'スタート';
      } else {
        isRunning = true;
        document.getElementById('btn-timer-start').textContent = '一時停止';
        timerInt = setInterval(() => {
          timerVal--;
          if (timerVal < 0) {
            isWork = !isWork;
            const w = parseInt(document.getElementById('cfg-work').value) || 30;
            const r = parseInt(document.getElementById('cfg-rest').value) || 5;
            timerVal = isWork ? w : r;
          }
          updateTimerUI();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInt);
      isRunning = false;
      isWork = true;
      timerVal = parseInt(document.getElementById('cfg-work').value) || 30;
      document.getElementById('btn-timer-start').textContent = 'スタート';
      updateTimerUI();
    }

    // エクスポート / インポート
    function exportData() {
      const data = { menus, records };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `basket_data_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.menus) menus = data.menus;
          if (data.records) records = data.records;
          saveMenus();
          saveRecords();
          alert('データの読み込みが完了しました！');
        } catch (err) {
          alert('ファイルの形式が正しくありません。');
        }
      };
      reader.readAsText(file);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    renderMenuList();
    renderCalendar();
  </script>
</body>
</html>
